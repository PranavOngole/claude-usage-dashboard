<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Claude Token Usage</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
  <style>
    :root {
      color-scheme: light dark;
      --page:        #f9f9f7;
      --surface:     #fcfcfb;
      --ink:         #0b0b0b;
      --ink-2:       #52514e;
      --muted:       #898781;
      --grid:        #e1e0d9;
      --border:      rgba(11,11,11,0.10);
      --header-bg:   #141413;
      --header-ink:  #fcfcfb;
      --header-mut:  rgba(252,252,251,0.55);
      --hover-wash:  #f4f3f0;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --page:        #0d0d0d;
        --surface:     #1a1a19;
        --ink:         #ffffff;
        --ink-2:       #c3c2b7;
        --muted:       #898781;
        --grid:        #2c2c2a;
        --border:      rgba(255,255,255,0.10);
        --header-bg:   #141413;
        --header-ink:  #fcfcfb;
        --header-mut:  rgba(252,252,251,0.55);
        --hover-wash:  #22221f;
      }
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: var(--page);
      color: var(--ink);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    /* Header */
    .header {
      background: var(--header-bg);
      color: var(--header-ink);
      padding: 26px 36px;
    }
    .header-inner {
      max-width: 1360px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }
    .header .eyebrow {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.14em;
      color: var(--header-mut);
      margin-bottom: 5px;
    }
    .header h1 {
      font-size: 21px;
      font-weight: 650;
      letter-spacing: -0.015em;
    }
    .header .updated {
      font-size: 12px;
      color: var(--header-mut);
      margin-top: 5px;
    }
    .source-tabs {
      display: flex;
      background: rgba(252,252,251,0.10);
      border-radius: 9px;
      padding: 3px;
      gap: 2px;
    }
    .source-tabs button {
      padding: 7px 18px;
      border: none;
      background: transparent;
      border-radius: 7px;
      font-size: 13px;
      font-weight: 550;
      font-family: inherit;
      color: rgba(252,252,251,0.65);
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }
    .source-tabs button:hover { color: #fcfcfb; }
    .source-tabs button.active {
      background: #fcfcfb;
      color: #0b0b0b;
    }
    .header-right { display: flex; align-items: center; gap: 10px; }
    .refresh-btn {
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(252,252,251,0.10);
      border: none;
      border-radius: 9px;
      color: rgba(252,252,251,0.75);
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }
    .refresh-btn:hover { background: rgba(252,252,251,0.18); color: #fcfcfb; }
    .refresh-btn svg { width: 16px; height: 16px; }
    .refresh-btn.spinning svg { animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Stats bar */
    .stats-bar {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
    }
    .stats-inner {
      max-width: 1360px;
      margin: 0 auto;
      padding: 20px 36px;
      display: flex;
      gap: 56px;
      flex-wrap: wrap;
    }
    .stat .label {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.11em;
      color: var(--muted);
    }
    .stat .val {
      font-size: 30px;
      font-weight: 700;
      color: var(--ink);
      letter-spacing: -0.025em;
      line-height: 1.2;
      margin-top: 2px;
    }

    /* Main layout */
    .main {
      max-width: 1360px;
      margin: 0 auto;
      padding: 28px 36px 48px;
    }

    /* Controls */
    .controls {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 18px;
      flex-wrap: wrap;
      min-height: 40px;
    }
    .tab-group {
      display: flex;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 9px;
      padding: 3px;
      gap: 2px;
    }
    .tab-group button {
      padding: 7px 18px;
      border: none;
      background: transparent;
      border-radius: 7px;
      font-size: 13px;
      font-weight: 550;
      font-family: inherit;
      color: var(--ink-2);
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }
    .tab-group button:hover { background: var(--hover-wash); }
    .tab-group button.active {
      background: var(--header-bg);
      color: #fcfcfb;
    }
    .back-btn {
      background: none;
      border: none;
      color: var(--ink-2);
      font-size: 13px;
      font-weight: 550;
      font-family: inherit;
      cursor: pointer;
      padding: 0;
    }
    .back-btn:hover { color: var(--ink); text-decoration: underline; }
    .sep { color: var(--muted); font-size: 13px; }
    .bc-label { font-size: 13px; font-weight: 600; color: var(--ink); }

    /* Cards */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 26px;
      margin-bottom: 18px;
      box-shadow: 0 1px 2px rgba(0,0,0,0.04);
    }
    .card-title {
      font-size: 15px;
      font-weight: 650;
      color: var(--ink);
      letter-spacing: -0.01em;
      margin-bottom: 3px;
    }
    .card-hint {
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 18px;
      min-height: 15px;
    }
    .chart-wrap {
      position: relative;
      height: 380px;
    }

    /* Empty state */
    .empty { text-align: center; padding: 76px 32px; }
    .empty h2 { font-size: 19px; font-weight: 650; color: var(--ink); margin-bottom: 10px; }
    .empty p { font-size: 14px; color: var(--ink-2); max-width: 480px; margin: 0 auto 8px; line-height: 1.65; }
    .empty code {
      background: var(--hover-wash);
      padding: 2px 7px;
      border-radius: 5px;
      font-size: 12px;
      font-family: ui-monospace, "SF Mono", monospace;
      color: var(--ink);
    }

    /* Table */
    .table-wrap { overflow-x: auto; padding: 10px 6px; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    thead th {
      padding: 10px 14px;
      text-align: left;
      font-size: 11px;
      font-weight: 650;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
      border-bottom: 1px solid var(--grid);
      white-space: nowrap;
    }
    thead th.num { text-align: right; }
    tbody td {
      padding: 10px 14px;
      border-bottom: 1px solid var(--grid);
      color: var(--ink-2);
      white-space: nowrap;
    }
    tbody tr:last-child td { border-bottom: none; }
    tbody tr:hover td { background: var(--hover-wash); }
    td.num { text-align: right; font-variant-numeric: tabular-nums; color: var(--ink-2); }
    td.bold { text-align: right; font-weight: 650; color: var(--ink); font-variant-numeric: tabular-nums; }
    tr.total-row td {
      font-weight: 700;
      color: var(--ink);
      background: transparent;
      border-top: 2px solid var(--grid);
      border-bottom: none;
    }
    tr.total-row:hover td { background: transparent; }
    .model-cell { display: flex; align-items: center; gap: 9px; color: var(--ink); font-weight: 500; }
    .dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
    .rates-note {
      font-size: 11px;
      color: var(--muted);
      padding: 14px 14px 4px;
      line-height: 1.7;
    }

    @media (max-width: 640px) {
      .header, .stats-inner, .main { padding-left: 18px; padding-right: 18px; }
      .stats-inner { gap: 26px; }
      .stat .val { font-size: 24px; }
      .chart-wrap { height: 290px; }
    }
  </style>
</head>
<body>

<div class="header">
  <div class="header-inner">
    <div>
      <div class="eyebrow">Anthropic Usage</div>
      <h1>Claude Token Usage</h1>
      <div class="updated" id="updated">Loading...</div>
    </div>
    <div class="header-right">
      <div class="source-tabs" id="source-tabs">
        <button data-source="subscription" class="active">Claude Code</button>
        <button data-source="claudeai">claude.ai</button>
        <button data-source="api">API</button>
      </div>
      <button class="refresh-btn" id="refresh-btn" title="Reload the latest published data" aria-label="Refresh data">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12a9 9 0 1 1-2.64-6.36"/>
          <polyline points="21 3 21 9 15 9"/>
        </svg>
      </button>
    </div>
  </div>
</div>

<div class="stats-bar">
  <div class="stats-inner" id="stats"></div>
</div>

<div class="main">
  <div class="controls" id="controls">
    <div class="tab-group" id="tabs">
      <button class="active" data-view="models">By Model</button>
      <button data-view="timeline">By Date</button>
    </div>
    <div id="breadcrumb" style="display:none; align-items:center; gap:10px;">
      <button class="back-btn" id="back-btn">&#8592; Back</button>
      <span class="sep">/</span>
      <span class="bc-label" id="bc-label"></span>
    </div>
  </div>

  <div class="card" id="chart-card">
    <div id="empty-state" style="display:none">
      <div class="empty" id="empty-body"></div>
    </div>
    <div id="chart-content">
      <div class="card-title" id="chart-title"></div>
      <div class="card-hint" id="chart-hint"></div>
      <div class="chart-wrap">
        <canvas id="chart"></canvas>
      </div>
    </div>
  </div>

  <div class="table-wrap card" id="table-card">
    <table id="data-table">
      <thead><tr id="thead"></tr></thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>
</div>

<script>
// ---- Palette (validated categorical slots, light + dark) ----

const SERIES_LIGHT = ['#2a78d6','#eb6834','#1baf7a','#eda100','#e87ba4','#008300','#4a3aa7','#e34948'];
const SERIES_DARK  = ['#3987e5','#d95926','#199e70','#c98500','#d55181','#008300','#9085e9','#e66767'];

// Fixed slot per model family, so a model keeps its color across views,
// sources, and data refreshes. Unknown models take the next free slot.
const MODEL_SLOTS = [
  ['claude-fable-5',   0], ['claude-mythos', 0],
  ['claude-opus-4-8',  1],
  ['claude-opus-5',    2],
  ['claude-sonnet-5',  3],
  ['claude-sonnet-4-6',4],
  ['claude-haiku-4-5', 5],
  ['claude-ai-chat',   6],
  ['claude-opus-4',    7],
];

// Token-type colors: the three input kinds as one blue ramp, output as the
// accent hue.
const TOKEN_COLORS_LIGHT = { input:'#2a78d6', cacheRead:'#9ec5f4', cacheCreate:'#0d366b', output:'#eb6834' };
const TOKEN_COLORS_DARK  = { input:'#3987e5', cacheRead:'#cde2fb', cacheCreate:'#184f95', output:'#d95926' };

const darkQuery = window.matchMedia('(prefers-color-scheme: dark)');
function isDark() { return darkQuery.matches; }
function seriesPalette() { return isDark() ? SERIES_DARK : SERIES_LIGHT; }
function tokenColors() { return isDark() ? TOKEN_COLORS_DARK : TOKEN_COLORS_LIGHT; }
function theme() {
  return isDark()
    ? { ink:'#ffffff', ink2:'#c3c2b7', muted:'#898781', grid:'#2c2c2a', surface:'#1a1a19', tipBg:'#2c2c2a', tipInk:'#ffffff' }
    : { ink:'#0b0b0b', ink2:'#52514e', muted:'#898781', grid:'#e1e0d9', surface:'#fcfcfb', tipBg:'#0b0b0b', tipInk:'#fcfcfb' };
}

// API list prices in $ per million tokens: [model prefix, input, output].
// Longest/most specific prefixes first. Cache reads bill at 10% of the
// input rate; cache writes at 1.25x (5-minute TTL) or 2x (1-hour TTL).
const PRICING = [
  ['claude-fable-5',   10, 50],
  ['claude-mythos',    10, 50],
  ['claude-opus-5',     5, 25],
  ['claude-opus-4-8',   5, 25],
  ['claude-opus-4-7',   5, 25],
  ['claude-opus-4-6',   5, 25],
  ['claude-opus-4-5',   5, 25],
  ['claude-sonnet-5',   3, 15],
  ['claude-sonnet-4',   3, 15],
  ['claude-haiku-4-5',  1,  5],
  ['claude-ai-chat',    3, 15],  // estimated chat volume, assumed Sonnet rates
];

function priceFor(model) {
  for (const [prefix, inp, out] of PRICING) {
    if (model.startsWith(prefix)) return { inp, out };
  }
  return null;
}

function costOf(record, model) {
  if (!record) return 0;
  const p = priceFor(model);
  if (!p) return 0;
  return (
    (record.input     || 0) * p.inp +
    (record.cacheRead || 0) * p.inp * 0.1 +
    (record.cc5m      || 0) * p.inp * 1.25 +
    (record.cc1h      || 0) * p.inp * 2 +
    (record.output    || 0) * p.out
  ) / 1e6;
}

function fmtUSD(n) {
  return n.toLocaleString('en-US', { style: 'currency', currency: 'USD' });
}

// ---- State ----

const SOURCES = {
  subscription: {
    file: 'data/subscription_usage.json',
    label: 'Claude Code',
    emptyHtml: `
      <h2>No Claude Code data yet</h2>
      <p>
        This view reads <code>data/subscription_usage.json</code>, built from your local
        Claude Code session transcripts. Run <code>scripts/refresh_subscription.sh</code>
        on your Mac to generate and push it.
      </p>`,
  },
  claudeai: {
    file: 'data/claudeai_usage.json',
    label: 'claude.ai',
    emptyHtml: `
      <h2>No claude.ai data yet</h2>
      <p>
        Anthropic has no usage API for claude.ai chats, so this view is estimated from
        your official data export. To feed it: on claude.ai go to
        <strong>Settings &rsaquo; Privacy &rsaquo; Export data</strong>, download the zip
        from the email into <code>~/Downloads</code>, then double-click
        <code>Refresh Claude Usage</code> on your Desktop.
      </p>`,
  },
  api: {
    file: 'data/usage.json',
    label: 'API',
    emptyHtml: `
      <h2>No API usage data yet</h2>
      <p>
        This view reads <code>data/usage.json</code>, which is updated daily
        by the GitHub Actions workflow. Trigger the workflow manually to populate it now.
      </p>
      <p style="margin-top:12px">
        Note: this requires an <strong>Admin API key</strong> (<code>sk-ant-admin01-...</code>)
        set as the <code>ANTHROPIC_ADMIN_KEY</code> repo secret.
      </p>`,
  },
};

let chart = null;
let summary = null;
let source = 'subscription';
let view = 'models';
let drill = null;

// ---- Utilities ----

function fmt(n) {
  n = n || 0;
  if (n >= 1e9) return (n / 1e9).toFixed(2) + 'B';
  if (n >= 1e6) return (n / 1e6).toFixed(2) + 'M';
  if (n >= 1e3) return (n / 1e3).toFixed(1) + 'K';
  return n.toLocaleString();
}

function fmtDate(s) {
  const [y, m, d] = s.split('-').map(Number);
  return new Date(y, m - 1, d).toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
}

function sumRecord(r) {
  if (!r) return 0;
  return (r.input || 0) + (r.cacheRead || 0) + (r.cacheCreate || 0) + (r.output || 0);
}

function modelColor(model) {
  return seriesPalette()[summary.slotOf[model] % 8];
}

// ---- Parse API response ----

function assignSlots(models) {
  const slotOf = {};
  const taken = new Set();
  for (const m of models) {
    const hit = MODEL_SLOTS.find(([prefix]) => m.startsWith(prefix));
    if (hit && !taken.has(hit[1])) { slotOf[m] = hit[1]; taken.add(hit[1]); }
  }
  let next = 0;
  for (const m of models) {
    if (slotOf[m] !== undefined) continue;
    while (taken.has(next % 8)) next++;
    slotOf[m] = next % 8;
    taken.add(next % 8);
  }
  return slotOf;
}

function parseData(raw) {
  const byDate  = {};
  const byModel = {};
  const dates   = new Set();
  const models  = new Set();

  for (const bucket of (raw.data || [])) {
    const date = bucket.starting_at.slice(0, 10);
    dates.add(date);

    for (const r of (bucket.results || [])) {
      const model = r.model || 'unknown';
      models.add(model);

      const cc = r.cache_creation || {};
      const record = {
        input:       r.uncached_input_tokens || 0,
        cacheRead:   r.cache_read_input_tokens || 0,
        cacheCreate: (cc.ephemeral_1h_input_tokens || 0) + (cc.ephemeral_5m_input_tokens || 0),
        cc5m:        cc.ephemeral_5m_input_tokens || 0,
        cc1h:        cc.ephemeral_1h_input_tokens || 0,
        output:      r.output_tokens || 0,
      };

      if (!byDate[date]) byDate[date] = {};
      byDate[date][model] = record;

      if (!byModel[model]) byModel[model] = {};
      byModel[model][date] = record;
    }
  }

  const modelList = [...models].sort();
  const slotOf = assignSlots(modelList);
  return {
    byDate,
    byModel,
    dates:  [...dates].sort(),
    models: modelList,
    slotOf,
    // Slot order is the validated palette adjacency; stacks, legends, and
    // table columns all follow it.
    modelsBySlot: [...modelList].sort((a, b) => slotOf[a] - slotOf[b]),
  };
}

// ---- Stats bar ----

function renderStats(raw) {
  let totalAll = 0, totalIn = 0, totalOut = 0;
  for (const bucket of (raw.data || [])) {
    for (const r of (bucket.results || [])) {
      const cc = r.cache_creation || {};
      const inp = (r.uncached_input_tokens || 0) + (r.cache_read_input_tokens || 0)
               + (cc.ephemeral_1h_input_tokens || 0) + (cc.ephemeral_5m_input_tokens || 0);
      const out = r.output_tokens || 0;
      totalIn  += inp;
      totalOut += out;
      totalAll += inp + out;
    }
  }
  let totalCost = 0;
  for (const date of summary.dates) {
    for (const model of summary.models) {
      totalCost += costOf(summary.byDate[date]?.[model], model);
    }
  }
  document.getElementById('stats').innerHTML = `
    <div class="stat"><div class="label">Total Tokens</div><div class="val">${fmt(totalAll)}</div></div>
    <div class="stat"><div class="label">Input</div><div class="val">${fmt(totalIn)}</div></div>
    <div class="stat"><div class="label">Output</div><div class="val">${fmt(totalOut)}</div></div>
    <div class="stat"><div class="label">Est. API Cost</div><div class="val">${fmtUSD(totalCost)}</div></div>
    <div class="stat"><div class="label">Models</div><div class="val">${summary.models.length}</div></div>
    <div class="stat"><div class="label">Days</div><div class="val">${summary.dates.length}</div></div>
  `;
}

// ---- Chart lifecycle ----

function destroyChart() {
  if (chart) { chart.destroy(); chart = null; }
}

function baseFont() {
  return { family: 'system-ui, -apple-system, "Segoe UI", sans-serif', size: 12 };
}

function legendOpts() {
  return {
    position: 'top',
    align: 'end',
    labels: {
      font: baseFont(),
      color: theme().ink2,
      usePointStyle: true,
      pointStyle: 'circle',
      boxWidth: 7,
      boxHeight: 7,
      padding: 16,
    },
  };
}

function tooltipOpts(extra = {}) {
  const t = theme();
  return {
    backgroundColor: t.tipBg,
    titleColor: t.tipInk,
    bodyColor: t.tipInk,
    titleFont: { ...baseFont(), weight: '600' },
    bodyFont: baseFont(),
    padding: 10,
    cornerRadius: 8,
    boxPadding: 4,
    usePointStyle: true,
    ...extra,
  };
}

function xAxis(opts = {}) {
  const t = theme();
  return {
    grid: { display: false },
    border: { color: t.grid },
    ticks: { font: baseFont(), color: t.muted, maxRotation: 0, autoSkipPadding: 12 },
    ...opts,
  };
}

function yAxis(opts = {}) {
  const t = theme();
  return {
    grid: { color: t.grid, drawTicks: false },
    border: { display: false },
    ticks: { font: baseFont(), color: t.muted, padding: 8, callback: v => fmt(v) },
    ...opts,
  };
}

// ---- Main render dispatcher ----

function renderView() {
  destroyChart();
  if (drill) {
    drill.type === 'date' ? renderDateDrill(drill.value) : renderModelDrill(drill.value);
    return;
  }
  view === 'models' ? renderModelView() : renderTimeline();
}

// ---- View: By Model (horizontal bar, total per model) ----

function renderModelView() {
  document.getElementById('chart-title').textContent = 'Token usage by model';
  document.getElementById('chart-hint').textContent  = 'Click any bar to see the daily trend for that model.';

  const { byModel, dates } = summary;

  const sorted = summary.modelsBySlot
    .map(model => ({
      model,
      color: modelColor(model),
      total: dates.reduce((s, d) => s + sumRecord(byModel[model]?.[d]), 0),
      cost:  dates.reduce((s, d) => s + costOf(byModel[model]?.[d], model), 0),
      agg: dates.reduce((agg, d) => {
        const r = byModel[model]?.[d] || {};
        agg.input       += r.input       || 0;
        agg.cacheRead   += r.cacheRead   || 0;
        agg.cacheCreate += r.cacheCreate || 0;
        agg.output      += r.output      || 0;
        return agg;
      }, { input: 0, cacheRead: 0, cacheCreate: 0, output: 0 }),
    }))
    .sort((a, b) => b.total - a.total);

  const ctx = document.getElementById('chart').getContext('2d');
  chart = new Chart(ctx, {
    type: 'bar',
    data: {
      labels: sorted.map(x => x.model),
      datasets: [{
        data: sorted.map(x => x.total),
        backgroundColor: sorted.map(x => x.color),
        borderWidth: 0,
        borderRadius: 4,
        maxBarThickness: 30,
      }],
    },
    options: {
      indexAxis: 'y',
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: { display: false },
        tooltip: tooltipOpts({
          callbacks: {
            label: c => ` ${fmt(c.raw)} tokens  (${fmtUSD(sorted[c.dataIndex].cost)} at API rates)`,
          },
        }),
      },
      scales: {
        x: { ...yAxis(), grid: { color: theme().grid, drawTicks: false } },
        y: { ...xAxis(), ticks: { font: baseFont(), color: theme().ink2 } },
      },
      onClick: (e, els) => {
        if (!els.length) return;
        drill = { type: 'model', value: sorted[els[0].index].model };
        updateNav();
        renderView();
      },
    },
  });

  // Table
  document.getElementById('thead').innerHTML =
    `<th>Model</th><th class="num">Rate In/Out ($/M)</th><th class="num">Input</th><th class="num">Cache Read</th><th class="num">Cache Create</th><th class="num">Output</th><th class="num">Total</th><th class="num">Est. Cost</th>`;

  const rows = sorted.map(x => {
    const p = priceFor(x.model);
    const rate = p ? `$${p.inp} / $${p.out}` : 'n/a';
    return `<tr>
      <td><div class="model-cell"><span class="dot" style="background:${x.color}"></span>${x.model}</div></td>
      <td class="num">${rate}</td>
      <td class="num">${fmt(x.agg.input)}</td>
      <td class="num">${fmt(x.agg.cacheRead)}</td>
      <td class="num">${fmt(x.agg.cacheCreate)}</td>
      <td class="num">${fmt(x.agg.output)}</td>
      <td class="bold">${fmt(x.total)}</td>
      <td class="bold">${fmtUSD(x.cost)}</td>
    </tr>`;
  }).join('');

  const t = sorted.reduce((agg, x) => {
    agg.input += x.agg.input; agg.cacheRead += x.agg.cacheRead;
    agg.cacheCreate += x.agg.cacheCreate; agg.output += x.agg.output;
    agg.total += x.total; agg.cost += x.cost;
    return agg;
  }, { input: 0, cacheRead: 0, cacheCreate: 0, output: 0, total: 0, cost: 0 });

  const totalRow = `<tr class="total-row">
    <td>Total</td><td></td>
    <td class="num">${fmt(t.input)}</td>
    <td class="num">${fmt(t.cacheRead)}</td>
    <td class="num">${fmt(t.cacheCreate)}</td>
    <td class="num">${fmt(t.output)}</td>
    <td class="num">${fmt(t.total)}</td>
    <td class="num">${fmtUSD(t.cost)}</td>
  </tr>`;

  document.getElementById('tbody').innerHTML = rows + totalRow;
  renderRatesNote();
}

// ---- View: By Date (stacked bar per day, stacked by model) ----

function renderTimeline() {
  document.getElementById('chart-title').textContent = 'Daily token usage';
  document.getElementById('chart-hint').textContent  = 'Click any bar to see the model breakdown for that day.';

  const { dates, byDate } = summary;
  const models_sorted = summary.modelsBySlot;
  const t = theme();

  const datasets = models_sorted.map(model => ({
    label: model,
    data: dates.map(date => sumRecord(byDate[date]?.[model])),
    backgroundColor: modelColor(model),
    borderColor: t.surface,
    borderWidth: 1,
    barPercentage: 0.72,
    categoryPercentage: 0.86,
  }));

  const ctx = document.getElementById('chart').getContext('2d');
  chart = new Chart(ctx, {
    type: 'bar',
    data: { labels: dates.map(fmtDate), datasets },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: legendOpts(),
        tooltip: tooltipOpts({
          callbacks: {
            label: c => ` ${c.dataset.label}: ${fmt(c.raw)}`,
            footer: items => `Total: ${fmt(items.reduce((s, i) => s + i.raw, 0))}`,
          },
        }),
      },
      scales: {
        x: { ...xAxis(), stacked: true },
        y: { ...yAxis(), stacked: true },
      },
      onClick: (e, els) => {
        if (!els.length) return;
        drill = { type: 'date', value: dates[els[0].index] };
        updateNav();
        renderView();
      },
    },
  });

  // Table: date rows, model columns
  document.getElementById('thead').innerHTML =
    `<th>Date</th>${models_sorted.map(m => `<th class="num">${m}</th>`).join('')}<th class="num">Total</th><th class="num">Est. Cost</th>`;

  const rows = [...dates].reverse().map(date => {
    const dayTotal = models_sorted.reduce((s, m) => s + sumRecord(byDate[date]?.[m]), 0);
    const dayCost  = models_sorted.reduce((s, m) => s + costOf(byDate[date]?.[m], m), 0);
    return `<tr>
      <td>${fmtDate(date)}</td>
      ${models_sorted.map(m => `<td class="num">${fmt(sumRecord(byDate[date]?.[m]))}</td>`).join('')}
      <td class="bold">${fmt(dayTotal)}</td>
      <td class="bold">${fmtUSD(dayCost)}</td>
    </tr>`;
  }).join('');

  const grandTotal = dates.reduce((s, d) => s + models_sorted.reduce((acc, m) => acc + sumRecord(byDate[d]?.[m]), 0), 0);
  const grandCost  = dates.reduce((s, d) => s + models_sorted.reduce((acc, m) => acc + costOf(byDate[d]?.[m], m), 0), 0);
  const totalRow = `<tr class="total-row">
    <td>Total</td>
    ${models_sorted.map(m => `<td class="num">${fmt(dates.reduce((s, d) => s + sumRecord(byDate[d]?.[m]), 0))}</td>`).join('')}
    <td class="num">${fmt(grandTotal)}</td>
    <td class="num">${fmtUSD(grandCost)}</td>
  </tr>`;

  document.getElementById('tbody').innerHTML = rows + totalRow;
  renderRatesNote();
}

// ---- Drilldown: single date -> model breakdown ----

function renderDateDrill(date) {
  document.getElementById('chart-title').textContent = `Model breakdown: ${fmtDate(date)}`;
  document.getElementById('chart-hint').textContent  = '';

  const { byDate } = summary;
  const dayData = byDate[date] || {};
  const active = summary.modelsBySlot
    .filter(m => dayData[m])
    .map(m => ({ model: m, total: sumRecord(dayData[m]), cost: costOf(dayData[m], m) }))
    .sort((a, b) => b.total - a.total);
  const dayTotal = active.reduce((s, x) => s + x.total, 0);
  const dayCost  = active.reduce((s, x) => s + x.cost, 0);

  const ctx = document.getElementById('chart').getContext('2d');
  chart = new Chart(ctx, {
    type: 'bar',
    data: {
      labels: active.map(x => x.model),
      datasets: [{
        data: active.map(x => x.total),
        backgroundColor: active.map(x => modelColor(x.model)),
        borderWidth: 0,
        borderRadius: 4,
        maxBarThickness: 30,
      }],
    },
    options: {
      indexAxis: 'y',
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: { display: false },
        tooltip: tooltipOpts({
          callbacks: {
            label: c => {
              const pct = dayTotal > 0 ? ((c.raw / dayTotal) * 100).toFixed(1) : '0';
              return ` ${fmt(c.raw)} tokens  (${pct}% of day)`;
            },
          },
        }),
      },
      scales: {
        x: { ...yAxis(), grid: { color: theme().grid, drawTicks: false } },
        y: { ...xAxis(), ticks: { font: baseFont(), color: theme().ink2 } },
      },
    },
  });

  document.getElementById('thead').innerHTML =
    `<th>Model</th><th class="num">Input</th><th class="num">Cache Read</th><th class="num">Cache Create</th><th class="num">Output</th><th class="num">Total</th><th class="num">Est. Cost</th><th class="num">Share</th>`;

  const rows = active.map(x => {
    const r = dayData[x.model];
    const pct = dayTotal > 0 ? ((x.total / dayTotal) * 100).toFixed(1) + '%' : '0%';
    return `<tr>
      <td><div class="model-cell"><span class="dot" style="background:${modelColor(x.model)}"></span>${x.model}</div></td>
      <td class="num">${fmt(r.input)}</td>
      <td class="num">${fmt(r.cacheRead)}</td>
      <td class="num">${fmt(r.cacheCreate)}</td>
      <td class="num">${fmt(r.output)}</td>
      <td class="bold">${fmt(x.total)}</td>
      <td class="bold">${fmtUSD(x.cost)}</td>
      <td class="num">${pct}</td>
    </tr>`;
  }).join('');

  const totalRow = `<tr class="total-row">
    <td>Total</td>
    <td class="num">${fmt(active.reduce((s, x) => s + (dayData[x.model].input || 0), 0))}</td>
    <td class="num">${fmt(active.reduce((s, x) => s + (dayData[x.model].cacheRead || 0), 0))}</td>
    <td class="num">${fmt(active.reduce((s, x) => s + (dayData[x.model].cacheCreate || 0), 0))}</td>
    <td class="num">${fmt(active.reduce((s, x) => s + (dayData[x.model].output || 0), 0))}</td>
    <td class="num">${fmt(dayTotal)}</td>
    <td class="num">${fmtUSD(dayCost)}</td>
    <td class="num">100%</td>
  </tr>`;

  document.getElementById('tbody').innerHTML = rows + totalRow;
  renderRatesNote();
}

// ---- Drilldown: single model -> daily trend ----

function renderModelDrill(model) {
  document.getElementById('chart-title').textContent = `Daily usage: ${model}`;
  document.getElementById('chart-hint').textContent  = 'Stacked by token type.';

  const { dates, byModel } = summary;
  const mData = byModel[model] || {};
  const tc = tokenColors();
  const t = theme();

  const seg = { borderColor: t.surface, borderWidth: 1, barPercentage: 0.72, categoryPercentage: 0.86 };
  const ctx = document.getElementById('chart').getContext('2d');
  chart = new Chart(ctx, {
    type: 'bar',
    data: {
      labels: dates.map(fmtDate),
      datasets: [
        { label: 'Input',        data: dates.map(d => mData[d]?.input       || 0), backgroundColor: tc.input,       ...seg },
        { label: 'Cache Read',   data: dates.map(d => mData[d]?.cacheRead   || 0), backgroundColor: tc.cacheRead,   ...seg },
        { label: 'Cache Create', data: dates.map(d => mData[d]?.cacheCreate || 0), backgroundColor: tc.cacheCreate, ...seg },
        { label: 'Output',       data: dates.map(d => mData[d]?.output      || 0), backgroundColor: tc.output,      ...seg },
      ],
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: legendOpts(),
        tooltip: tooltipOpts({
          callbacks: {
            label: c => ` ${c.dataset.label}: ${fmt(c.raw)}`,
            footer: items => `Total: ${fmt(items.reduce((s, i) => s + i.raw, 0))}`,
          },
        }),
      },
      scales: {
        x: { ...xAxis(), stacked: true },
        y: { ...yAxis(), stacked: true },
      },
    },
  });

  const activeDates = dates.filter(d => mData[d]);

  document.getElementById('thead').innerHTML =
    `<th>Date</th><th class="num">Input</th><th class="num">Cache Read</th><th class="num">Cache Create</th><th class="num">Output</th><th class="num">Total</th><th class="num">Est. Cost</th>`;

  const rows = [...activeDates].reverse().map(date => {
    const r = mData[date];
    return `<tr>
      <td>${fmtDate(date)}</td>
      <td class="num">${fmt(r.input)}</td>
      <td class="num">${fmt(r.cacheRead)}</td>
      <td class="num">${fmt(r.cacheCreate)}</td>
      <td class="num">${fmt(r.output)}</td>
      <td class="bold">${fmt(sumRecord(r))}</td>
      <td class="bold">${fmtUSD(costOf(r, model))}</td>
    </tr>`;
  }).join('');

  const agg = activeDates.reduce((a, d) => {
    const r = mData[d];
    a.input += r.input || 0; a.cacheRead += r.cacheRead || 0;
    a.cacheCreate += r.cacheCreate || 0; a.output += r.output || 0;
    a.total += sumRecord(r); a.cost += costOf(r, model);
    return a;
  }, { input: 0, cacheRead: 0, cacheCreate: 0, output: 0, total: 0, cost: 0 });

  const totalRow = `<tr class="total-row">
    <td>Total</td>
    <td class="num">${fmt(agg.input)}</td>
    <td class="num">${fmt(agg.cacheRead)}</td>
    <td class="num">${fmt(agg.cacheCreate)}</td>
    <td class="num">${fmt(agg.output)}</td>
    <td class="num">${fmt(agg.total)}</td>
    <td class="num">${fmtUSD(agg.cost)}</td>
  </tr>`;

  document.getElementById('tbody').innerHTML = rows + totalRow;
  renderRatesNote();
}

// ---- Rates footnote ----

function renderRatesNote() {
  let note = document.getElementById('rates-note');
  if (!note) {
    note = document.createElement('div');
    note.id = 'rates-note';
    note.className = 'rates-note';
    document.getElementById('table-card').appendChild(note);
  }
  const used = summary.models.map(m => {
    const p = priceFor(m);
    return p ? `${m}: $${p.inp} in / $${p.out} out` : `${m}: rate unknown`;
  });
  note.innerHTML =
    `Est. cost at standard API list prices per 1M tokens (${used.join(' &middot; ')}). ` +
    `Cache reads bill at 10% of the input rate; cache writes at 1.25x (5-min TTL) or 2x (1-hour TTL).` +
    (summary.models.includes('claude-ai-chat')
      ? ` claude-ai-chat is chat volume estimated from your claude.ai export (~4 chars/token, context replayed with cache assumptions), priced at assumed Sonnet rates; thinking tokens, system prompts, and attachments are not included, so treat it as a floor.`
      : '');
}

// ---- Navigation state ----

function updateNav() {
  const tabs = document.getElementById('tabs');
  const bc   = document.getElementById('breadcrumb');
  const bcLabel = document.getElementById('bc-label');

  if (drill) {
    tabs.style.display = 'none';
    bc.style.display   = 'flex';
    bcLabel.textContent = drill.type === 'date' ? fmtDate(drill.value) : drill.value;
  } else {
    tabs.style.display = 'flex';
    bc.style.display   = 'none';
  }
}

// ---- Empty state ----

function showEmpty() {
  document.getElementById('empty-body').innerHTML = SOURCES[source].emptyHtml;
  document.getElementById('empty-state').style.display = 'block';
  document.getElementById('chart-content').style.display = 'none';
  document.getElementById('table-card').style.display = 'none';
  document.getElementById('stats').innerHTML = '';
  document.getElementById('controls').style.display = 'none';
  document.getElementById('updated').textContent = `${SOURCES[source].label}: no data`;
}

function showContent() {
  document.getElementById('empty-state').style.display = 'none';
  document.getElementById('chart-content').style.display = 'block';
  document.getElementById('table-card').style.display = 'block';
  document.getElementById('controls').style.display = 'flex';
}

// ---- Data loading ----

async function loadSource() {
  destroyChart();
  let raw;
  try {
    // Cache-bust so a refresh always pulls the newest published data
    // rather than a stale CDN/browser copy.
    const resp = await fetch(`${SOURCES[source].file}?t=${Date.now()}`);
    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
    raw = await resp.json();
  } catch (e) {
    showEmpty();
    return;
  }

  if (!raw.data || raw.data.length === 0) {
    showEmpty();
    return;
  }

  summary = parseData(raw);
  showContent();

  let updatedText = raw.fetched_at
    ? `${SOURCES[source].label} usage. Last updated: ${new Date(raw.fetched_at).toLocaleString()}`
    : `${SOURCES[source].label} usage`;
  if (raw.estimated) {
    updatedText += ` (estimated from ${raw.export_name || 'chat export'})`;
  }
  document.getElementById('updated').textContent = updatedText;

  renderStats(raw);
  updateNav();
  renderView();
}

// ---- Init ----

function init() {
  // Source switching (Claude Code vs API)
  document.getElementById('source-tabs').addEventListener('click', e => {
    const btn = e.target.closest('button[data-source]');
    if (!btn || btn.dataset.source === source) return;
    source = btn.dataset.source;
    drill = null;
    document.querySelectorAll('#source-tabs button').forEach(b =>
      b.classList.toggle('active', b.dataset.source === source));
    loadSource();
  });

  // Tab switching
  document.getElementById('tabs').addEventListener('click', e => {
    const btn = e.target.closest('button[data-view]');
    if (!btn) return;
    view = btn.dataset.view;
    drill = null;
    document.querySelectorAll('#tabs button').forEach(b =>
      b.classList.toggle('active', b.dataset.view === view));
    updateNav();
    renderView();
  });

  // Back button
  document.getElementById('back-btn').addEventListener('click', () => {
    drill = null;
    updateNav();
    renderView();
  });

  // Refresh button: re-fetch the current source and re-render
  document.getElementById('refresh-btn').addEventListener('click', async e => {
    const btn = e.currentTarget;
    if (btn.classList.contains('spinning')) return;
    btn.classList.add('spinning');
    const started = Date.now();
    await loadSource();
    // Keep the spin visible long enough to register as feedback
    setTimeout(() => btn.classList.remove('spinning'), Math.max(0, 600 - (Date.now() - started)));
  });

  // Re-render charts when the OS theme flips, so chart ink/grid/series
  // colors follow the CSS variables.
  darkQuery.addEventListener('change', () => { if (summary) renderView(); });

  loadSource();
}

init();
</script>
